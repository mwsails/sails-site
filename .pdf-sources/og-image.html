<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Public+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0D1B4B 0%, #2B60BE 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 60% at 88% 6%, rgba(90, 142, 224, 0.38), transparent 62%),
      radial-gradient(ellipse 55% 50% at 6% 96%, rgba(43, 96, 190, 0.28), transparent 65%);
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .mark {
    width: 100px;
    height: auto;
    margin-bottom: 32px;
    filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.35));
  }
  .tagline {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 800;
    font-size: 66px;
    line-height: 1.05;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .tagline .accent { color: #5A8EE0; }
  .sub {
    margin-top: 26px;
    font-family: 'Public Sans', -apple-system, sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
  <div class="content">
    <img class="mark" src="../assets/sails-lockup-white.png" alt="" />
    <div class="tagline">Put the <span class="accent">Win</span>d in Your Sales.</div>
    <div class="sub">AI Go-To-Market Team &middot; B2B SaaS</div>
  </div>
</body>
</html>
