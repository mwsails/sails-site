# Netlify configuration for sailsadvisory.com
# Static site, no build step required. One Netlify Function
# (netlify/functions/cro-agent.js) backs the live homepage agent;
# Netlify installs its package.json deps and bundles it automatically,
# the static site's publish/build settings below are unaffected.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
