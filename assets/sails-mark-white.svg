    <polygon points="0,0 14,5 0,10"/>
    <line x1="0" y1="0" x2="0" y2="118" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 8 L 56 116 L 0 116 Z"/>
    <path d="M 0 22 L -46 112 L 0 112 Z" opacity="0.85"/>
    <path d="M -54 118 L 64 118 L 50 138 L -42 138 Z" opacity="0.92"/>
    <path d="M -78 150 Q -40 144 0 150 T 78 150" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M -94 158 Q -50 152 0 158 T 94 158" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <text x="160" y="210" text-anchor="middle"
